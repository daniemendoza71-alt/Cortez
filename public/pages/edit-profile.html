<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f4f4f9;
        }
        .card {
        background: #fff;
        padding: 24px;
        border-radius: 8px;
        max-width: 400px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
        margin-top: 0;
        color: #333;
        }
        .form-group {
        margin-bottom: 16px;
        }
        label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #555;
        }
        input[type="text"],
        input[type="email"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        }
        .btn-submit {
        background-color: #007bff;
        color: white;
        padding: 10px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        }
        .btn-submit:hover {
        background-color: #0056b3;
        }
        .actions {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        }
        a {
        color: #666;
        text-decoration: none;
        }
    </style>
</head>
    <body>
        <div class="card">
            <h1>Edit Profile</h1>
            <form action="/edit-profile" method="POST">
                <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="Danie" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="Danie@example.com" required>
            </div>

            <div class="actions">
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="/profile">Cancel</a>
            </div>
            </form>
        </div>
    </body>
</html>
